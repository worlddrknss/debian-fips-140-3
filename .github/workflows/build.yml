name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild picks up Debian security updates.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A newer commit cancels an in-progress run, except on main, where that
# would interrupt a publish halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lint
        run: make lint

  build:
    needs: lint
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # Per-target GitHub Actions cache scopes (see docker-bake.hcl).
      CACHE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every image and variant is loaded for testing; the runner's preinstalled
      # toolchains aren't used and would otherwise crowd the disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Keys the base image's apt layer to the ISO week, so the first build
      # each week picks up Debian security updates instead of the cached layer.
      - name: Set apt refresh key
        run: echo "APT_REFRESH=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          targets: default,test
          load: true

      - name: Test base
        run: make test-base

      - name: Test go
        run: make test-go

      - name: Test node
        run: make test-node

      - name: Test bun
        run: make test-bun

      - name: Test python
        run: make test-python

      - name: Test dotnet
        run: make test-dotnet

      - name: Test java
        run: make test-java

      - name: Test nginx-ingress
        run: make test-nginx-ingress

      - name: Check distroless images
        run: make distroless

      # CIS Docker Benchmark. Fails on WARN/FATAL findings in the runtime
      # images; -dev findings are reported only. See scripts/dockle-images.sh.
      - name: Check image hardening (Dockle)
        run: scripts/dockle-images.sh
        env:
          DOCKLE: goodwithtech/dockle:v0.4.15

      # Report-only: findings go to the job summary and to code scanning, and
      # never fail the build. Only vulnerabilities with an available fix are
      # reported, since those are the ones a rebuild or bump can resolve. The
      # vulnerability database (~3 GB unpacked) is downloaded once and shared
      # by parallel scans; see scripts/scan-images.sh.
      - name: Scan images
        run: scripts/scan-images.sh "${{ matrix.arch }}"
        env:
          GRYPE: anchore/grype:v0.119.0

      # Pull requests from forks get a read-only token and can't upload.
      - name: Upload runtime scan results to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scan/runtime

      - name: Upload dev scan results to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scan/dev

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set registry
        if: env.PUBLISH == 'true'
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"

      # Pushes this architecture untagged, by digest. The manifest job joins
      # the amd64 and arm64 digests under the real tags. The build itself is
      # served from the cache populated above.
      # The metadata goes to a file: with every image's provenance it is too
      # large to pass between steps in an environment variable.
      - name: Push by digest
        if: env.PUBLISH == 'true'
        env:
          PUSH_BY_DIGEST: "true"
        run: docker buildx bake --metadata-file "$RUNNER_TEMP/bake-metadata.json"

      - name: Export digests
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          jq 'with_entries(select(.value | type == "object" and has("containerimage.digest"))
                | .value = .value["containerimage.digest"])' \
            "$RUNNER_TEMP/bake-metadata.json" > "digests/${{ matrix.arch }}.json"
          cat "digests/${{ matrix.arch }}.json"

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.json
          retention-days: 1

  manifest:
    name: publish multi-arch images
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      build-tag: ${{ steps.tags.outputs.build-tag }}
      subjects: ${{ steps.tags.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      # Tags each image latest<flavor><variant>, its version, and a unique
      # YYYYMMDD-<sha> build tag, all pointing at one multi-arch index. Records
      # each index digest for the attest and release jobs.
      - name: Create multi-arch tags
        id: tags
        run: |
          export REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/"
          BUILD_TAG="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          export BUILD_TAG
          echo "[]" > subjects.json
          docker buildx bake --print 2>/dev/null \
            | jq -r '.target | to_entries[] | [.key, (.value.tags | join(" "))] | @tsv' \
            | while IFS=$'\t' read -r target tags; do
                first="${tags%% *}"
                name="${first%%:*}"
                set --
                for tag in $tags; do set -- "$@" -t "$tag"; done
                for arch in amd64 arm64; do
                  digest="$(jq -r --arg t "$target" '.[$t]' "digests/$arch.json")"
                  set -- "$@" "$name@$digest"
                done
                docker buildx imagetools create "$@"
                index="$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)"
                jq --arg name "$name" --arg tag "${first##*:}" --arg digest "$index" \
                  '. + [{name: $name, tag: $tag, digest: $digest}]' subjects.json > subjects.tmp
                mv subjects.tmp subjects.json
              done
          echo "build-tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "subjects=$(jq -c . subjects.json)" >> "$GITHUB_OUTPUT"

  # Signs a SLSA build provenance attestation for each published multi-arch
  # image with GitHub's Sigstore instance and stores it in GHCR, and signs the
  # image itself with cosign. Verify with:
  #   gh attestation verify oci://ghcr.io/<owner>/<image>:<tag> --owner <owner>
  #   cosign verify ghcr.io/<owner>/<image>:<tag> --certificate-oidc-issuer \
  #     https://token.actions.githubusercontent.com --certificate-identity-regexp \
  #     '^https://github.com/<owner>/debian-fips-140-3/'
  # (The Sigstore trust roots differ: attestations use GitHub's, cosign the
  # public-good instance.)
  attest:
    name: attest (${{ matrix.subject.tag }} ${{ matrix.subject.name }})
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.manifest.outputs.subjects) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.subject.name }}
          subject-digest: ${{ matrix.subject.digest }}
          push-to-registry: true

      # Keyless cosign signature on the image itself (GitHub OIDC identity,
      # logged in Sigstore's public transparency log), so admission policies
      # and `cosign verify` can require it. See README "Verifying an image".
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          IMAGE: ${{ matrix.subject.name }}@${{ matrix.subject.digest }}
        run: cosign sign --yes "$IMAGE"

  # One GitHub Release per published build, with a readable summary and the
  # SPDX SBOM of every image. The 10 newest build releases are kept.
  release:
    name: release SBOMs
    needs: [manifest, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write notes and SBOMs
        env:
          SUBJECTS: ${{ needs.manifest.outputs.subjects }}
          BUILD_TAG: ${{ needs.manifest.outputs.build-tag }}
        run: |
          echo "$SUBJECTS" > subjects.json
          scripts/release-notes.sh subjects.json release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.manifest.outputs.build-tag }}
        run: |
          gh release create "build-$BUILD_TAG" release/sbom/*.spdx.json \
            --title "Build $BUILD_TAG" --notes-file release/notes.md --target "$GITHUB_SHA" --latest
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | tail -n +11 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done

  cleanup:
    name: prune old images
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      # Keeps the 20 newest tagged images of each package (5 builds, each with
      # up to 4 variants) and deletes everything else, including untagged
      # per-arch images no longer referenced by a kept tag.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: debian-fips-base,debian-fips-go,debian-fips-node,debian-fipsbase-bun,debian-fips-python,debian-fips-dotnet,debian-fips-java,debian-fips-nginx-ingress
          keep-n-tagged: 20
          exclude-tags: latest,latest-dev,latest-pqc,latest-pqc-dev
          delete-untagged: true
          validate: true
