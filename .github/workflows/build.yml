name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild picks up Debian security updates to the system OpenSSL.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lint
        run: make lint

  build:
    needs: lint
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Node.js compiles from source; a cold build takes most of an hour.
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          load: true
          set: |
            base.cache-from=type=gha,scope=base-${{ matrix.arch }}
            base.cache-to=type=gha,scope=base-${{ matrix.arch }},mode=max
            go.cache-from=type=gha,scope=go-${{ matrix.arch }}
            go.cache-to=type=gha,scope=go-${{ matrix.arch }},mode=max
            node.cache-from=type=gha,scope=node-${{ matrix.arch }}
            node.cache-to=type=gha,scope=node-${{ matrix.arch }},mode=max
            bun.cache-from=type=gha,scope=bun-${{ matrix.arch }}
            bun.cache-to=type=gha,scope=bun-${{ matrix.arch }},mode=max

      - name: Test base
        run: make test-base

      - name: Test go
        run: make test-go

      - name: Test node
        run: make test-node

      - name: Test bun
        run: make test-bun

      # Report-only: findings go to the job summary and to code scanning, and
      # never fail the build. Only vulnerabilities with an available fix are
      # reported, since those are the ones a rebuild or bump can resolve.
      - name: Scan images
        run: |
          mkdir -p scan
          for image in base go node bun; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/scan:/scan" \
              "$GRYPE" "debian-fips-$image:latest" --only-fixed \
              -o "table=/scan/$image.txt" -o "sarif=/scan/$image.sarif"
            # A distinct category per image and arch keeps code scanning from
            # treating the uploads as one run.
            jq --arg id "grype/$image/${{ matrix.arch }}/" \
              '.runs[].automationDetails = {id: $id}' "scan/$image.sarif" > "scan/$image.tmp"
            mv "scan/$image.tmp" "scan/$image.sarif"
            {
              echo "### debian-fips-$image (${{ matrix.arch }})"
              echo '```'
              cat "scan/$image.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
        env:
          GRYPE: anchore/grype:v0.119.0

      # Pull requests from forks get a read-only token and can't upload.
      - name: Upload scan results to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scan

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set registry
        if: env.PUBLISH == 'true'
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"

      # Pushes this architecture untagged, by digest. The manifest job joins
      # the amd64 and arm64 digests under the real tags. The build itself is
      # served from the cache populated above.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        env:
          PUSH_BY_DIGEST: "true"
        with:
          source: .
          set: |
            base.cache-from=type=gha,scope=base-${{ matrix.arch }}
            go.cache-from=type=gha,scope=go-${{ matrix.arch }}
            node.cache-from=type=gha,scope=node-${{ matrix.arch }}
            bun.cache-from=type=gha,scope=bun-${{ matrix.arch }}

      - name: Export digests
        if: env.PUBLISH == 'true'
        env:
          METADATA: ${{ steps.push.outputs.metadata }}
        run: |
          mkdir -p digests
          echo "$METADATA" \
            | jq 'with_entries(.value = .value["containerimage.digest"])' \
            > "digests/${{ matrix.arch }}.json"
          cat "digests/${{ matrix.arch }}.json"

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.json
          retention-days: 1

  manifest:
    name: publish multi-arch images
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      # Tags each image latest, its version, and a unique YYYYMMDD-<sha> build
      # tag, all pointing at one multi-arch index.
      - name: Create multi-arch tags
        run: |
          export REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/"
          BUILD_TAG="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          export BUILD_TAG
          docker buildx bake --print 2>/dev/null \
            | jq -r '.target | to_entries[] | [.key, (.value.tags | join(" "))] | @tsv' \
            | while IFS=$'\t' read -r target tags; do
                name="${tags%%:*}"
                set --
                for tag in $tags; do set -- "$@" -t "$tag"; done
                for arch in amd64 arm64; do
                  digest="$(jq -r --arg t "$target" '.[$t]' "digests/$arch.json")"
                  set -- "$@" "$name@$digest"
                done
                docker buildx imagetools create "$@"
              done

  # Signs a SLSA build provenance attestation for each published multi-arch
  # image with GitHub's Sigstore instance and stores it in GHCR. Verify with:
  #   gh attestation verify oci://ghcr.io/<owner>/debian-fips-base:latest --owner <owner>
  attest:
    name: attest (${{ matrix.image }})
    needs: manifest
    strategy:
      matrix:
        image: [base, go, node, bun]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve digest
        id: digest
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/debian-fips-${{ matrix.image }}"
          digest="$(docker buildx imagetools inspect "$name:latest" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digest.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  cleanup:
    name: prune old images
    needs: attest
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      # Keeps the 5 newest tagged builds of each image and deletes everything
      # else, including untagged per-arch images no longer referenced by a
      # kept multi-arch tag.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: debian-fips-base,debian-fips-go,debian-fips-node,debian-fips-bun
          keep-n-tagged: 5
          exclude-tags: latest
          delete-untagged: true
          validate: true
