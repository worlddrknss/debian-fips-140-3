name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_apt:
        description: "Rebuild the apt layer now (pick up Debian security updates released this week)"
        type: boolean
        default: false
  # Weekly rebuild picks up Debian security updates.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A newer commit cancels an in-progress run, except on main, where that
# would interrupt a publish halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Whether anything that goes into the images changed. Docs-only pull requests
  # and pushes skip the image build (the build jobs still run, so the required
  # checks report, but every step is skipped). Scheduled and manual runs always
  # build.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: filter
        with:
          filters: |
            images:
              - images/**
              - tests/**
              - scripts/**
              - vex/**
              - docker-bake.hcl
              - Makefile
              - .github/workflows/build.yml

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Lint
        run: make lint

  build:
    needs: [changes, lint]
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      BUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true' }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.images == 'true') }}
      # Per-target GitHub Actions cache scopes (see docker-bake.hcl).
      CACHE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.BUILD == 'true'

      # Every image and variant is loaded for testing; the runner's preinstalled
      # toolchains aren't used and would otherwise crowd the disk.
      - name: Free disk space
        if: env.BUILD == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.BUILD == 'true'

      # Keys the base image's apt layer. The published key (fips.apt.refresh
      # label) is reused while it's from this week and the published image
      # has no pending Debian security updates, so the layer cache stays warm.
      # Otherwise the key is new: a new week, or pending security updates, or
      # refresh_apt, rerun apt-get upgrade instead of reusing a stale layer.
      - name: Set apt refresh key
        if: env.BUILD == 'true'
        env:
          REFRESH_APT: ${{ inputs.refresh_apt }}
        run: |
          week="$(date -u +%G-W%V)"
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/debian-fips-base:latest-dev"
          published="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' 2>/dev/null \
            | jq -r 'to_entries[0].value.config.Labels["fips.apt.refresh"] // empty' || true)"
          pending="$(scripts/pending-security-updates.sh "$ref" 2>/dev/null || echo unknown)"
          echo "published key: ${published:-none}; pending security updates: ${pending:-none}"
          if [ "$REFRESH_APT" != "true" ] && [ -z "$pending" ] \
             && { [ "$published" = "$week" ] || [ "${published#"$week"-run}" != "$published" ]; }; then
            key="$published"
          elif [ "$REFRESH_APT" != "true" ] && [ -z "$pending" ]; then
            key="$week"
          else
            key="$week-run$GITHUB_RUN_ID"
          fi
          echo "apt refresh key: $key"
          echo "APT_REFRESH=$key" >> "$GITHUB_ENV"

      - name: Build images
        id: bake
        if: env.BUILD == 'true'
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: default,test
          load: true

      # One retry for transient cache errors ("error writing layer blob:
      # not_found"). Layers that finished are reused, so a real build failure
      # fails again quickly.
      - name: Build images (retry)
        if: env.BUILD == 'true' && steps.bake.outcome == 'failure'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: default,test
          load: true

      - name: Test base
        if: env.BUILD == 'true'
        run: make test-base

      - name: Test go
        if: env.BUILD == 'true'
        run: make test-go

      - name: Test node
        if: env.BUILD == 'true'
        run: make test-node

      - name: Test bun
        if: env.BUILD == 'true'
        run: make test-bun

      - name: Test python
        if: env.BUILD == 'true'
        run: make test-python

      - name: Test dotnet
        if: env.BUILD == 'true'
        run: make test-dotnet

      - name: Test java
        if: env.BUILD == 'true'
        run: make test-java

      - name: Test nginx-ingress
        if: env.BUILD == 'true'
        run: make test-nginx-ingress

      # The images just built must not have pending Debian security updates;
      # otherwise a stale apt layer was reused and publishing would ship it.
      - name: Check for pending security updates
        if: env.BUILD == 'true'
        run: |
          status=0
          for ref in $(docker buildx bake --print 2>/dev/null | jq -r '.target[].tags[0]' | grep -- '-dev$'); do
            pending="$(scripts/pending-security-updates.sh "$ref")"
            if [ -n "$pending" ]; then
              echo "::error::$ref has pending Debian security updates: $pending"
              status=1
            fi
          done
          exit "$status"

      - name: Check distroless images
        if: env.BUILD == 'true'
        run: make distroless

      # CIS Docker Benchmark. Fails on WARN/FATAL findings in the runtime
      # images; -dev findings are reported only. See scripts/dockle-images.sh.
      - name: Check image hardening (Dockle)
        if: env.BUILD == 'true'
        run: scripts/dockle-images.sh
        env:
          DOCKLE: goodwithtech/dockle:v0.4.15

      # Report-only: findings go to the job summary and to code scanning, and
      # never fail the build. Only vulnerabilities with an available fix are
      # reported, since those are the ones a rebuild or bump can resolve. The
      # vulnerability database (~3 GB unpacked) is downloaded once and shared
      # by parallel scans; see scripts/scan-images.sh.
      - name: Scan images
        if: env.BUILD == 'true'
        run: scripts/scan-images.sh "${{ matrix.arch }}"
        env:
          GRYPE: anchore/grype:v0.119.0

      # Pull requests from forks get a read-only token and can't upload.
      - name: Upload runtime scan results to code scanning
        if: env.BUILD == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scan/runtime

      - name: Upload dev scan results to code scanning
        if: env.BUILD == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scan/dev

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set registry
        if: env.PUBLISH == 'true'
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/" >> "$GITHUB_ENV"

      # Pushes this architecture untagged, by digest. The manifest job joins
      # the amd64 and arm64 digests under the real tags. The build itself is
      # served from the cache populated above.
      # The metadata goes to a file: with every image's provenance it is too
      # large to pass between steps in an environment variable.
      - name: Push by digest
        if: env.PUBLISH == 'true'
        env:
          PUSH_BY_DIGEST: "true"
        run: docker buildx bake --metadata-file "$RUNNER_TEMP/bake-metadata.json"

      - name: Export digests
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          jq 'with_entries(select(.value | type == "object" and has("containerimage.digest"))
                | .value = .value["containerimage.digest"])' \
            "$RUNNER_TEMP/bake-metadata.json" > "digests/${{ matrix.arch }}.json"
          cat "digests/${{ matrix.arch }}.json"

      - name: Upload digests
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.json
          retention-days: 1

  manifest:
    name: publish multi-arch images
    needs: [changes, build]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.images == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      build-tag: ${{ steps.tags.outputs.build-tag }}
      subjects: ${{ steps.tags.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      # Tags each image latest<flavor><variant>, its version, and a unique
      # YYYYMMDD-<sha> build tag, all pointing at one multi-arch index. Records
      # each index digest for the attest and release jobs.
      - name: Create multi-arch tags
        id: tags
        run: |
          export REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/"
          BUILD_TAG="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          export BUILD_TAG
          echo "[]" > subjects.json
          docker buildx bake --print 2>/dev/null \
            | jq -r '.target | to_entries[] | [.key, (.value.tags | join(" "))] | @tsv' \
            | while IFS=$'\t' read -r target tags; do
                first="${tags%% *}"
                name="${first%%:*}"
                set --
                for tag in $tags; do set -- "$@" -t "$tag"; done
                for arch in amd64 arm64; do
                  digest="$(jq -r --arg t "$target" '.[$t]' "digests/$arch.json")"
                  set -- "$@" "$name@$digest"
                done
                docker buildx imagetools create "$@"
                index="$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)"
                jq --arg name "$name" --arg tag "${first##*:}" --arg digest "$index" \
                  '. + [{name: $name, tag: $tag, digest: $digest}]' subjects.json > subjects.tmp
                mv subjects.tmp subjects.json
              done
          echo "build-tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "subjects=$(jq -c . subjects.json)" >> "$GITHUB_OUTPUT"

  # Signs a SLSA build provenance attestation for each published multi-arch
  # image with GitHub's Sigstore instance and stores it in GHCR, and signs the
  # image itself with cosign. Verify with:
  #   gh attestation verify oci://ghcr.io/<owner>/<image>:<tag> --owner <owner>
  #   cosign verify ghcr.io/<owner>/<image>:<tag> --certificate-oidc-issuer \
  #     https://token.actions.githubusercontent.com --certificate-identity-regexp \
  #     '^https://github.com/<owner>/debian-fips-140-3/'
  # (The Sigstore trust roots differ: attestations use GitHub's, cosign the
  # public-good instance.)
  attest:
    name: attest (${{ matrix.subject.tag }} ${{ matrix.subject.name }})
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.manifest.outputs.subjects) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.subject.name }}
          subject-digest: ${{ matrix.subject.digest }}
          push-to-registry: true

      # Keyless cosign signature on the image itself (GitHub OIDC identity,
      # logged in Sigstore's public transparency log), so admission policies
      # and `cosign verify` can require it. See README "Verifying an image".
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image
        env:
          IMAGE: ${{ matrix.subject.name }}@${{ matrix.subject.digest }}
        run: cosign sign --yes "$IMAGE"

  # One GitHub Release per published build, with a readable summary and the
  # SPDX SBOM of every image. The 10 newest build releases are kept.
  release:
    name: release SBOMs
    needs: [manifest, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      id-token: write # keyless signatures for the release files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release step looks back through main's history

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write notes and SBOMs
        env:
          SUBJECTS: ${{ needs.manifest.outputs.subjects }}
          BUILD_TAG: ${{ needs.manifest.outputs.build-tag }}
        run: |
          echo "$SUBJECTS" > subjects.json
          scripts/release-notes.sh subjects.json release

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # A Sigstore bundle next to each SBOM, so the release files can be
      # verified too:
      #   cosign verify-blob <sbom> --bundle <sbom>.sigstore.json \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/<owner>/debian-fips-140-3/'
      - name: Sign SBOMs
        run: |
          for sbom in release/sbom/*.spdx.json; do
            cosign sign-blob --yes --bundle "$sbom.sigstore.json" "$sbom"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ needs.manifest.outputs.build-tag }}
        # GITHUB_TOKEN can't create a tag on a commit that changes workflow
        # files (it never has the workflows permission). In that case the
        # release is tagged on the newest earlier commit that doesn't, and the
        # notes keep naming the commit the images were built from.
        run: |
          target="$GITHUB_SHA"
          if ! git diff --quiet "$target^" "$target" -- .github/workflows; then
            for c in $(git rev-list "$GITHUB_SHA^"); do
              if git diff --quiet "$c^" "$c" -- .github/workflows 2>/dev/null; then target="$c"; break; fi
            done
            {
              echo
              echo "This release is tagged on \`${target::7}\`, the newest commit before \`${GITHUB_SHA::7}\` that"
              echo "doesn't change workflow files, because GitHub Actions can't tag those commits."
            } >> release/notes.md
          fi
          gh release create "build-$BUILD_TAG" release/sbom/*.spdx.json release/sbom/*.sigstore.json \
            --title "Build $BUILD_TAG" --notes-file release/notes.md --target "$target" --latest
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | tail -n +11 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done

  cleanup:
    name: prune old images
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      # Keeps the 40 newest tagged images of each package (10 builds, each with
      # up to 4 variants, matching the 10 build releases and their SBOMs) and
      # deletes everything else, including untagged per-arch images no longer
      # referenced by a kept tag.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: debian-fips-base,debian-fips-go,debian-fips-node,debian-fipsbase-bun,debian-fips-python,debian-fips-dotnet,debian-fips-java,debian-fips-nginx-ingress
          keep-n-tagged: 40
          exclude-tags: latest,latest-dev,latest-pqc,latest-pqc-dev
          delete-untagged: true
          validate: true

  # Closes the loop on update-pins. Its pull request comes from GITHUB_TOKEN,
  # so this pull_request run waits for approval; update-pins approves it. The
  # required checks only count runs attached to the pull request, which is why
  # this runs here and not in a dispatched build. Once lint and both builds
  # pass, the pull request is merged. A merge made with GITHUB_TOKEN doesn't
  # trigger the push build on main, so main is dispatched explicitly to
  # publish. Only the bot's update-pins/auto pull request is merged.
  automerge:
    needs: [lint, build]
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'update-pins/auto' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge the pin update and publish from main
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          # Only merge the commit this run built.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$NUMBER" -R "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref main
