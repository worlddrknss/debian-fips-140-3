name: update-pins

# Opens a pull request when a pinned upstream release (Debian digest, Node.js,
# npm, Go, Bun, .NET, Bouncy Castle TLS/util) has a newer version. Checksums
# are computed from the official release files; see scripts/update-pins.sh.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update pins
        run: scripts/update-pins.sh "$RUNNER_TEMP/changes.md"

      # Pull requests opened with GITHUB_TOKEN don't trigger workflows, so the
      # build is dispatched on the branch explicitly; its checks show on the PR.
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "All pins are current."
            exit 0
          fi
          branch="update-pins/$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: update pinned upstream versions" -m "$(cat "$RUNNER_TEMP/changes.md")"
          git push --force origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            {
              echo "Pinned upstream versions with newer releases:"
              echo
              cat "$RUNNER_TEMP/changes.md"
              echo
              echo "Checksums were computed from the official release files by \`scripts/update-pins.sh\`."
              echo "The OpenSSL FIPS provider and \`bc-fips\` are never bumped automatically."
            } > "$RUNNER_TEMP/body.md"
            gh pr create --head "$branch" --title "chore: update pinned upstream versions" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
          gh workflow run build.yml --ref "$branch"
