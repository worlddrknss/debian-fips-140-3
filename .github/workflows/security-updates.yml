name: security-updates

# NIST SP 800-53 SI-2 (flaw remediation): the images are rebuilt weekly, and
# this daily check rebuilds them early when Debian has published a security
# update for any package in them. It asks each published -dev image (the
# distroless images are assembled from the same packages) what apt would
# upgrade from the security archive, and runs the apps' Trivy release gate
# (scripts/trivy-fixable.sh) over the tags they pull.
#
# Not on Mondays: the weekly build an hour later starts a new apt refresh key
# and picks the updates up anyway.
on:
  schedule:
    - cron: "0 5 * * 0,2-6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write # to start the build workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look for pending Debian security updates
        id: check
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          found=""
          for image in debian-fips-base debian-fips-node debian-fipsbase-bun debian-fips-python \
                       debian-fips-dotnet debian-fips-java debian-fips-nginx-ingress; do
            ref="ghcr.io/$owner/$image:latest-dev"
            updates="$(scripts/pending-security-updates.sh "$ref")"
            echo "$ref: ${updates:-none}"
            [ -z "$updates" ] || found="$found $image: $updates;"
          done
          {
            echo "### Pending Debian security updates"
            echo "${found:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      # The downstream apps (Vara Performance, D76 Riders, madebymeyrill) gate
      # every release on Trivy: fixable HIGH/CRITICAL (scripts/trivy-fixable.sh).
      # Scan the tags they pull, so a finding that would block them rebuilds
      # the images here first, even when apt's security check sees nothing.
      - name: Look for fixable HIGH/CRITICAL findings (Trivy, the apps' release gate)
        id: trivy
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          found=""
          for ref in debian-fipsbase-bun:latest-pqc debian-fipsbase-bun:latest-pqc-dev \
                     debian-fips-base:latest debian-fips-node:latest debian-fips-python:latest \
                     debian-fips-dotnet:latest debian-fips-java:latest debian-fips-nginx-ingress:latest; do
            image="ghcr.io/$owner/$ref"
            docker buildx imagetools inspect "$image" >/dev/null 2>&1 || { echo "$image: not published"; continue; }
            hits="$(scripts/trivy-fixable.sh "$image" | paste -sd',' -)"
            echo "$image: ${hits:-none}"
            [ -z "$hits" ] || found="$found $ref: $hits;"
          done
          {
            echo "### Fixable HIGH/CRITICAL (Trivy)"
            echo "${found:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          APT_FOUND: ${{ steps.check.outputs.found }}
          TRIVY_FOUND: ${{ steps.trivy.outputs.found }}
        run: echo "rebuild=$([ -n "$APT_FOUND$TRIVY_FOUND" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # refresh_apt reruns the apt layer; a plain rebuild would reuse this
      # week's cached layer and publish the same packages again.
      - name: Rebuild and publish
        if: steps.decide.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f refresh_apt=true
