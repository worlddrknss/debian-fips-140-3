name: alerts

# Opens an issue when automation is broken: a failed build, security-updates
# or update-pins run on main, or a pin update pull request whose build failed
# or that hasn't merged within two days. The issue closes once that's fixed.
# scripts/automation-alerts.sh reads the current state, so it runs on a
# schedule as well: GitHub sends no workflow_run event for runs that
# GITHUB_TOKEN started (the pin pull request and the dispatched builds).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_run:
    workflows: [build, update-pins, security-updates]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or close alert issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/automation-alerts.sh
