# Included in the http block by the patched main template (nginx.tmpl.patch).
#
# TLS to backends (https upstreams, gRPC over TLS) accepts only AES-256-GCM
# for TLS 1.2. The controller otherwise renders proxy_ssl_ciphers from its
# policy, which defaults to OpenSSL's "DEFAULT" list and allows AES-128.
# ssl_conf_command runs after the cipher list is set, so it wins. TLS 1.3
# suites already follow /etc/ssl/openssl.cnf (TLS_AES_256_GCM_SHA384 only).
proxy_ssl_conf_command CipherString ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
grpc_ssl_conf_command CipherString ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
